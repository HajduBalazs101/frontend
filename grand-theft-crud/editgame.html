<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Új játék</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="index.html">Főoldal</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-item nav-link active" href="newgame.html">Új játék</a>
            </div>
        </div>
    </nav>
    <form id="editjatekform">

        <div class="form-group">
            <label>Játék címe</label>
            <input id="gametitle" type="text" class="form-control">
        </div>
        <div class="form-group">
            <label>Játék műfaja</label>
            <input id="gamegenre" type="text" class="form-control">
        </div>
        <div class="form-group">
            <label>Megjelenési éve</label>
            <input id="gamereleaseyear" type="number" min="0" class="form-control">
        </div>
        <div class="form-group">
            <label>Kép url</label>
            <input id="gameimageurl" type="text" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Mentés</button>
    </form>
    <script src="script.js"></script>
</body>

</html>
