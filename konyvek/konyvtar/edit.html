<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyv módosítása</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-form">
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">📚 Könyvtár</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Könyvek</a>
                <a class="nav-link" href="post.html">Új könyv felvitele</a>
                <a class="nav-link active" href="edit.html">Könyv módosítása</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="card form-card shadow-lg">
            <div class="card-header text-center">
                <h2>Adatok módosítása</h2>
            </div>
            <div class="card-body p-4">
                <form id="editKonyvek">
                    <div class="mb-3">
                        <label for="nev" class="form-label fw-bold">Könyv neve</label>
                        <input type="text" class="form-control" id="nev" required>
                    </div>
                    <div class="mb-3">
                        <label for="kiadasEve" class="form-label fw-bold">Kiadás éve</label>
                        <input type="number" class="form-control" id="kiadasEve" required>
                    </div>
                    <div class="mb-3">
                        <label for="ertekeles" class="form-label fw-bold">Értékelés</label>
                        <input type="number" step="0.1" class="form-control" id="ertekeles" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="kepneve" class="form-label fw-bold">Kép neve (URL)</label>
                            <input type="text" class="form-control" id="kepneve" required>
                        </div>
                    </div>
                    <div class="d-grid mt-3">
                        <button type="submit" class="btn btn-warning btn-lg">Módosítás mentése</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script src="edit.js"></script>
</body>
</html>
